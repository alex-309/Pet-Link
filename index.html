<title>Pawlyglot</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo app for a fictional smart pet collar: simulated GPS, heart rate, activity logs and a just-for-fun pet translator.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<script>
  // Apply a saved theme / motion choice before first paint to avoid a flash.
  try {
    var saved = JSON.parse(localStorage.getItem('pawlyglot.v1') || '{}').settings || {};
    if (saved.theme === 'light' || saved.theme === 'dark') {
      document.documentElement.dataset.theme = saved.theme;
      document.documentElement.dataset.themeOwner = 'app';
    }
    if (saved.motion === 'reduce' || saved.motion === 'full') document.documentElement.dataset.motion = saved.motion;
  } catch (e) { /* storage unavailable: use system settings */ }
</script>
</head>
